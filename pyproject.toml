[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "frnn_cuda"
version = "3.1.0"
description = "Standalone CUDA fixed-radius nearest-neighbor library"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "libFRNN contributors" }]
dependencies = ["numpy>=1.23"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/xju2/libFRNN"

[tool.scikit-build]
cmake.version = ">=3.20"
wheel.packages = ["python/frnn_cuda"]
sdist.include = [
  "CMakeLists.txt",
  "Config.cmake.in",
  "LICENSE",
  "README.md",
  "benchmarks/*.cu",
  "benchmarks/results/*.csv",
  "docs/*.md",
  "examples/*.py",
  "src/frnn.cu",
  "src/fast_path.cu",
  "src/include/frnn/*.hpp",
  "python/bindings.cpp",
  "python/torch_bindings.cpp",
  "python/frnn_cuda/*.py",
  "tests/*.cpp",
  "tests/*.py",
  "tests/consumer/CMakeLists.txt",
  "tests/consumer/*.cpp",
]
sdist.exclude = [
  ".git/**",
  ".venv*/**",
  "build*/**",
  "install*/**",
  "dist/**",
  "data/**",
  ".ruff_cache/**",
  "**/__pycache__/**",
  "tests/__pycache__/**",
  "**/*.pyc",
  "tests/*.pyc",
]

[tool.scikit-build.cmake.define]
FRNN_BUILD_PYTHON = "ON"
FRNN_BUILD_TESTS = "OFF"
FRNN_BUILD_BENCHMARKS = "OFF"
BUILD_SHARED_LIBS = "OFF"

# Wheels (CI: .github/workflows/wheels.yml). The CUDA compiler is installed into
# the manylinux container; auditwheel bundles libcudart, and the NVIDIA driver
# comes from the user's system. The PyTorch extension is not in the wheels: it
# must match the user's torch, so it is built from source (FRNN_BUILD_TORCH=AUTO).
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
build-verbosity = 1
test-command = "python -c \"import frnn_cuda; print(frnn_cuda.__version__)\""

[tool.cibuildwheel.linux]
before-all = "bash {project}/ci/install_cuda.sh"
# Real code for Volta through Blackwell, plus PTX for newer GPUs.
environment = { PATH = "/usr/local/cuda/bin:$PATH", CUDACXX = "/usr/local/cuda/bin/nvcc", CMAKE_ARGS = "-DCMAKE_CUDA_ARCHITECTURES='70-real;75-real;80-real;86-real;89-real;90-real;100-real;120'" }
